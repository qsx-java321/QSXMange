server:
  port: 8080

spring:
  application:
    name: qsx-manager
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/QSXManager?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
  data:
    redis:
      # 本地 Redis 容器（redis:7.4.9，无密码，见 docs/dev-env/组件依赖README.md）
      host: localhost
      port: 6379
      # 认证链路依赖 Redis（令牌有效性以 Redis 为准），必须显式设置超时：
      # 默认 60s 会让 Redis 故障时每个请求都挂 60 秒才失败
      timeout: 2s
      connect-timeout: 1s
  servlet:
    multipart:
      # Excel 导入上传大小限制
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  # Mapper XML 位置
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.qsx.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 逻辑删除相关配置
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Excel 导入自定义配置
import:
  # 批量导入用户的默认初始密码（上线前务必替换并妥善保管）
  default-password: qsx123456

# RBAC 权限缓存配置（Redis）
qsx:
  rbac-cache:
    # 总开关：false 时退化为实时查库（降级/特殊环境用）
    enabled: true
    # 缓存兜底 TTL（主动失效优先，TTL 仅兜底）
    ttl: 30m
  # 双 token 会话配置（Redis 为令牌有效性的唯一真相源）
  auth:
    session:
      # access token 有效期（qsx:auth:at:* 的 TTL），过期后前端应静默刷新
      at-ttl: 30m
      # refresh token 与会话 Hash 的有效期，每次刷新滑动续期
      rt-ttl: 7d
      # 自首次登录起的会话绝对上限，轮换不重置，超限强制重新登录
      max-lifetime: 30d

# 打印启动信息
logging:
  level:
    com.qsx: debug