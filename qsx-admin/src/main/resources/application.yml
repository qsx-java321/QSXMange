server:
  port: 8080

spring:
  application:
    name: qsx-manager
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/QSXManager?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
  data:
    redis:
      # 本地 Redis 容器（redis:7.4.9，无密码，见 docs/dev-env/组件依赖README.md）
      host: localhost
      port: 6379
      # 认证链路依赖 Redis（令牌有效性以 Redis 为准），必须显式设置超时：
      # 默认 60s 会让 Redis 故障时每个请求都挂 60 秒才失败
      timeout: 2s
      connect-timeout: 1s
  servlet:
    multipart:
      # Excel 导入上传大小限制
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    # 本地 Mailpit 假 SMTP（docs/dev-env/组件依赖README.md）：SMTP 1025 / Web UI 8025 取码
    # 上线切真实邮箱：改这里即可，代码零改动（发件地址改 qsx.captcha.from-address）
    # 注意：JavaMailSender 由本段存在与否决定是否装配，SmtpEmailService 强依赖它——删掉会导致启动失败
    host: localhost
    port: 1025
    username: ""      # Mailpit 不校验账号密码
    password: ""

mybatis-plus:
  # Mapper XML 位置
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.qsx.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 逻辑删除相关配置
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Excel 导入自定义配置
import:
  # 批量导入用户的默认初始密码（上线前务必替换并妥善保管）
  default-password: qsx123456

# RBAC 权限缓存配置（Redis）
qsx:
  rbac-cache:
    # 总开关：false 时退化为实时查库（降级/特殊环境用）
    enabled: true
    # 缓存兜底 TTL（主动失效优先，TTL 仅兜底）
    ttl: 30m
  # 邮箱验证码配置（Redis + Lua，见 qsx-module-system/src/main/resources/lua/captcha_*.lua）
  captcha:
    # true = 不投递邮件，验证码随响应 data.code 直接返回（仅本地联调！）
    # 切换后 Spring 装配 DebugEmailService 而非 SmtpEmailService，启动会打 WARN 横幅
    debug: false
    # 验证码有效期（⚠️ 纯数字会被当作毫秒：写 300 是 300 毫秒，不是 5 分钟）
    ttl: 5m
    # 同一张码允许错几次，达到即作废
    max-attempts: 5
    # 同场景同邮箱的发送间隔
    send-interval: 60s
    # 同场景同邮箱的每日发送上限
    daily-limit: 10
    # 发件地址（Mailpit 可用任意地址；真实服务商多数要求该地址已备案/校验）
    from-address: no-reply@qsx.local
  # 双 token 会话配置（Redis 为令牌有效性的唯一真相源）
  auth:
    session:
      # access token 有效期（qsx:auth:at:* 的 TTL），过期后前端应静默刷新
      at-ttl: 30m
      # refresh token 与会话 Hash 的有效期，每次刷新滑动续期
      rt-ttl: 7d
      # 自首次登录起的会话绝对上限，轮换不重置，超限强制重新登录
      max-lifetime: 30d

# 打印启动信息
logging:
  level:
    com.qsx: debug