server:
  port: 8080

spring:
  application:
    name: qsx-manager
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/QSXManager?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # 口令外部化：默认值是本地 init.sql 的开发口令，
    # 让「clone → 建库 → 起服务」开箱即用；**生产形态必须显式提供**——
    # application-prod.yml 用的是**不带默认值**的占位符，解析不到即启动失败。
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  data:
    redis:
      # 本地 Redis 容器（redis:7.4.9，无密码，见 docs/dev-env/组件依赖README.md）
      host: localhost
      port: 6379
      # 认证链路依赖 Redis（令牌有效性以 Redis 为准），必须显式设置超时：
      # 默认 60s 会让 Redis 故障时每个请求都挂 60 秒才失败
      timeout: 2s
      connect-timeout: 1s
  servlet:
    multipart:
      # Excel 导入上传大小限制
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    # 本地 Mailpit 假 SMTP（docs/dev-env/组件依赖README.md）：SMTP 1025 / Web UI 8025 取码
    # 上线切真实邮箱：改这里即可，代码零改动（发件地址改 qsx.captcha.from-address）
    # 注意：JavaMailSender 由本段存在与否决定是否装配，SmtpEmailService 强依赖它——删掉会导致启动失败
    host: localhost
    port: 1025
    username: ""      # Mailpit 不校验账号密码
    password: ""
    properties:
      mail:
        smtp:
          # ⚠️ 三个超时必须显式配置：JavaMail 的默认值是「无限等待」，一旦 SMTP 服务商被
          # greylist、限流，或链路丢包（连上后对端不响应），投递线程会一直挂住不归还。
          # 这种"挂住"会沿着 captchaMailExecutor 扩散：队列打满后由请求线程兜底执行，
          # Tomcat 线程被钉死在 SMTP 上 ⇒ 全站不可用。
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

mybatis-plus:
  # Mapper XML 位置
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.qsx.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    # 必须用 Slf4jImpl：StdOutImpl 会 **绕过日志框架**直接 System.out.println，
    # 于是带参数的 SQL 原文（BCrypt 哈希、邮箱、导入默认口令）持续打到 stdout，
    # 而改 logging.level 对它**完全无效**。
    # 需要看 SQL 时改 `logging.level.com.qsx.mapper: debug`，不要改回 StdOutImpl。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 逻辑删除相关配置
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Excel 导入自定义配置
import:
  # 批量导入用户的**临时**初始密码：导入落库的账号一律被置 must_change_password=1，
  # 首次登录即被强制改密（见 qsx.auth.session 上方的说明），故它只在「导入 → 首次登录」
  # 这个短窗口内有效。但它毕竟是仓库里公开的值，生产形态必须显式提供
  # （application-prod.yml 用不带默认值的占位符）。
  default-password: ${IMPORT_DEFAULT_PASSWORD:qsx123456}

# RBAC 权限缓存配置（Redis）
#
# 【强制首次改密】sys_user.must_change_password = 1 的账号，登录后拿到的令牌**只能访问
# /auth/** 前缀**（登录 / 刷新 / 当前用户 / 登出 / 发码 / 忘记密码 / 改密），访问其它任何
# 接口一律返回 body 业务码 1037。置 1 的三处：init.sql 预置超管、Excel 导入落库、后台建号
# （user:create）；改密与忘记密码重置成功后自动置 0（唯一写库入口 UserServiceImpl#updatePassword）。
# 判定在 TokenAuthenticationFilter 里、与「账号是否禁用」同一处、每请求实时查库，
# 因此没有额外的 Redis 状态、也不改三条会话 Lua。
qsx:
  rbac-cache:
    # 总开关：false 时退化为实时查库（降级/特殊环境用）
    enabled: true
    # 缓存兜底 TTL（主动失效优先，TTL 仅兜底）
    ttl: 30m
  # 邮箱验证码配置（Redis + Lua，见 qsx-module-system/src/main/resources/lua/captcha_*.lua）
  captcha:
    # true = 不投递邮件，验证码随响应 data.code 直接返回（仅本地联调！）
    # 切换后 Spring 装配 DebugEmailService 而非 SmtpEmailService，启动会打 WARN 横幅
    debug: false
    # 验证码有效期（⚠️ 纯数字会被当作毫秒：写 300 是 300 毫秒，不是 5 分钟）
    ttl: 5m
    # 同一张码允许错几次，达到即作废
    max-attempts: 5
    # 同场景同邮箱的发送间隔
    send-interval: 60s
    # 同场景同邮箱的每日发送上限
    daily-limit: 10
    # 同一客户端 IP 的每日发送上限（跨邮箱累计）：每个邮箱各有 10 次额度，
    # 不设 IP 维度的话"换邮箱"就等于无限额度，可被用来向任意地址群发（#14/#22）
    ip-daily-limit: 30
    # 发件地址（Mailpit 可用任意地址；真实服务商多数要求该地址已备案/校验）
    from-address: no-reply@qsx.local
  # 双 token 会话配置（Redis 为令牌有效性的唯一真相源）
  auth:
    session:
      # access token 有效期（qsx:auth:at:* 的 TTL），过期后前端应静默刷新
      at-ttl: 30m
      # refresh token 与会话 Hash 的有效期，每次刷新滑动续期
      rt-ttl: 7d
      # 自首次登录起的会话绝对上限，轮换不重置，超限强制重新登录
      max-lifetime: 30d

# 启动信息。
# com.qsx 用 info 而非 debug：debug 会把每次请求的权限缓存命中、SQL 参数等全部打出来，
# 其中含邮箱与口令哈希。要看 SQL 时临时加
# `logging.level.com.qsx.mapper: debug`。
logging:
  level:
    com.qsx: info